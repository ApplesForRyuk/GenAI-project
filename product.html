<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details | Book Haven</title>
    <style>
        /* Global Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        /* Header */
        header {
            background: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }

        nav ul {
            list-style: none;
            padding: 0;
        }

        nav ul li {
            display: inline;
            margin: 0 15px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
        }

        /* Product Details */
        .product-details {
            text-align: center;
            padding: 50px;
        }

        .product-container {
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            width: 60%;
            margin: auto;
        }

        .product-container img {
            width: 250px;
            height: auto;
            margin-right: 20px;
            border-radius: 5px;
        }

        .product-info {
            text-align: left;
            max-width: 400px;
        }

        .buy-btn {
            background: #007BFF;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .buy-btn:hover {
            background: #0056b3;
        }

        .back-link {
            display: block;
            margin-top: 10px;
            color: #007BFF;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* Footer */
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <header>
        <h1>Book Haven</h1>
        <nav>
            <ul>
                <li><a href="login.html">Home</a></li>
                <li><a href="#">Books</a></li>
                <li><a href="#">About</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Product Details Section -->
    <section class="product-details">
        <div class="product-container">
            <img src="images/book1.jpg" alt="Book Title 1">
            <div class="product-info">
                <h2>Book Title 1</h2>
                <p><strong>Author:</strong> John Doe</p>
                <p><strong>Price:</strong> $12.99</p>
                <p>
                    <strong>Description:</strong> This is an exciting novel that takes you on an adventure through mystery and drama. A must-read for book lovers!
                </p>
                <button class="buy-btn">Buy Now</button>
                <a href="login.html" class="back-link">← Back to Home</a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Book Haven. All rights reserved.</p>
    </footer>

</body>
</html>
